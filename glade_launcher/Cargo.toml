[package]
name = "glade_launcher"
version = "1.3.2"
edition = "2024"
authors = ["GladeLoader Team"]
description = "Fast, cozy and elegant mod launcher for Tiny Glade"

[dependencies]
eframe = { version = "0.36.2", default-features = true, features = ["glow"] }
rfd = "0.17.2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
open = "5.3"
